<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
    rel="stylesheet">
  <title>24Frames</title>
</head>

<body>
  <div id="app">
    <div id="mood-background-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
    <div id="navbar-container"></div>

    <!-- Home View -->
    <div id="home-view">
      <div id="mood-selector-container"></div>
      <div id="search-results-container" class="movie-grid"></div>
    </div>

    <!-- Matrix View (Hidden by default) -->
    <div id="matrix-view" style="display: none;">
      <div id="matrix-container-wrapper"></div>
      <div id="randomizer-wrapper"></div>
    </div>

    <!-- Modals -->
    <div id="movie-modal-container"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
